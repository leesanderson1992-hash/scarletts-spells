<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADLE desktop fit review</title>
  <style>
    :root { font-family: ui-sans-serif, system-ui, sans-serif; color: #172039; background: #fff7fc; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 2rem clamp(1rem, 4vw, 4rem); background: #ffe8f5; border-bottom: 1px solid #eab9d3; }
    h1 { margin: 0 0 .5rem; }
    p { line-height: 1.5; }
    main { display: grid; gap: 2rem; padding: 2rem clamp(1rem, 4vw, 4rem); }
    section { padding: 1rem; border: 1px solid #eab9d3; border-radius: 1rem; background: white; }
    h2 { margin: 0 0 1rem; }
    .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr)); gap: 1rem; }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; border: 1px solid #c7a7ba; border-radius: .65rem; }
    figcaption { padding: .5rem 0; font-weight: 700; }
  </style>
</head>
<body>
  <header><h1>ADLE desktop fit review</h1><p>Actual browser captures at 1280 × 720. The task and page both have zero vertical overflow in each capture. The review targets short desktop and laptop viewports; reflection can scroll.</p><p><a href="../index.html">Full lesson lookbook</a></p></header>
  <main>
    <section><h2>Scrabble</h2><div class="pair"><figure><img src="scrabble-light-1280x720.png" alt="Light Scrabble lesson at 1280 by 720"><figcaption>Light</figcaption></figure><figure><img src="scrabble-dark-1280x720.png" alt="Dark Scrabble lesson at 1280 by 720"><figcaption>Dark</figcaption></figure></div></section>
    <section><h2>Comparison reading</h2><div class="pair"><figure><img src="reading-light-1280x720.png" alt="Light comparison reading at 1280 by 720"><figcaption>Light</figcaption></figure><figure><img src="reading-dark-1280x720.png" alt="Dark comparison reading at 1280 by 720"><figcaption>Dark</figcaption></figure></div></section>
    <section><h2>Compound puzzle</h2><div class="pair"><figure><img src="compound-light-1280x720.png" alt="Light compound puzzle at 1280 by 720"><figcaption>Light</figcaption></figure><figure><img src="compound-dark-1280x720.png" alt="Dark compound puzzle at 1280 by 720"><figcaption>Dark</figcaption></figure></div></section>
    <section><h2>Generic Word Lab</h2><div class="pair"><figure><img src="generic-light-1280x720.png" alt="Light generic Word Lab at 1280 by 720"><figcaption>Light</figcaption></figure><figure><img src="generic-dark-1280x720.png" alt="Dark generic Word Lab at 1280 by 720"><figcaption>Dark</figcaption></figure></div></section>
  </main>
</body>
</html>
