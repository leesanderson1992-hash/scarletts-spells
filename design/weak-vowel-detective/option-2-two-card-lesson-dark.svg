<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#171426" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1440" height="72" rx="0" fill="#211b32" stroke="none" stroke-width="1"/><line x1="0" y1="72" x2="1440" y2="72" stroke="#8b6c9d" stroke-width="2" stroke-linecap="round"/><rect x="28" y="18" width="106" height="36" rx="18.0" fill="#2a263c" stroke="#8b6c9d" stroke-width="2"/><text x="81.0" y="41.1" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle">← Back</text><text x="161" y="43" fill="#ffa9d8" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="start">Scarlett’s Spells</text><text x="1200" y="42" fill="#d7c2df" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.2">THE SECRET LIFE OF VOWELS</text><text x="60" y="111" fill="#ffa9d8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" text-anchor="start" letter-spacing="1.4">OPTION 2 · TWO-CARD LESSON</text><rect x="520" y="83" width="106" height="34" rx="17.0" fill="#2a263c" stroke="#8b6c9d" stroke-width="2"/><text x="573.0" y="104.42" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Learn</text><rect x="635" y="83" width="106" height="34" rx="17.0" fill="#2a263c" stroke="#8b6c9d" stroke-width="2"/><text x="688.0" y="104.42" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dinner</text><rect x="750" y="83" width="106" height="34" rx="17.0" fill="#df3b99" stroke="#df3b99" stroke-width="2"/><text x="803.0" y="104.42" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Detective</text><rect x="865" y="83" width="106" height="34" rx="17.0" fill="#2a263c" stroke="#8b6c9d" stroke-width="2"/><text x="918.0" y="104.42" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Memory</text><rect x="980" y="83" width="106" height="34" rx="17.0" fill="#2a263c" stroke="#8b6c9d" stroke-width="2"/><text x="1033.0" y="104.42" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dictation</text><rect x="1095" y="83" width="106" height="34" rx="17.0" fill="#2a263c" stroke="#8b6c9d" stroke-width="2"/><text x="1148.0" y="104.42" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Reflect</text><rect x="35" y="135" width="1370" height="738" rx="28" fill="#211f34" stroke="#8b6c9d" stroke-width="1.5"/><text x="720" y="185" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" text-anchor="middle">Vowel Detective</text><rect x="70" y="212" width="775" height="203" rx="22" fill="#2a263c" stroke="#8b6c9d" stroke-width="2"/><text x="95" y="242" fill="#ffa9d8" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="start" letter-spacing="1.4">THE GAME</text><text x="95" y="277" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">A quiet vowel has gone missing. Listen and choose its spelling.</text><text x="95" y="306" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Then explore related words for a clue and try again from memory.</text><rect x="864" y="212" width="506" height="203" rx="22" fill="#2a263c" stroke="#8b6c9d" stroke-width="2"/><text x="889" y="242" fill="#ffa9d8" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="start" letter-spacing="1.2">HOW TO DO THE TASK</text><text x="889" y="278" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start">1  Hear the word and choose a vowel tile.</text><text x="889" y="310" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start">2  Submit your first thought.</text><text x="889" y="342" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="start">3  Explore family clues, then try again.</text><rect x="70" y="429" width="1300" height="385" rx="25" fill="#242744" stroke="#60d7e7" stroke-width="2"/><text x="98" y="460" fill="#d7c2df" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="start" letter-spacing="1.2">WORD 1 OF 5 · FIRST THOUGHT</text><text x="98" y="499" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" text-anchor="start">Which vowel belongs in the gap?</text><rect x="1126" y="466" width="210" height="50" rx="25.0" fill="#343a5a" stroke="#7fd7e8" stroke-width="2"/><text x="1231.0" y="496.78" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle">▶ Hear the word</text><text x="720" y="610" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="800" text-anchor="middle">hum_n</text><rect x="489.5" y="639" width="66" height="66" rx="14" fill="#343a5a" stroke="#7fd7e8" stroke-width="2"/><text x="522.5" y="682.56" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">A</text><rect x="568.5" y="639" width="66" height="66" rx="14" fill="#343a5a" stroke="#7fd7e8" stroke-width="2"/><text x="601.5" y="682.56" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">E</text><rect x="647.5" y="639" width="66" height="66" rx="14" fill="#343a5a" stroke="#7fd7e8" stroke-width="2"/><text x="680.5" y="682.56" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">I</text><rect x="726.5" y="639" width="66" height="66" rx="14" fill="#343a5a" stroke="#7fd7e8" stroke-width="2"/><text x="759.5" y="682.56" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">O</text><rect x="805.5" y="639" width="66" height="66" rx="14" fill="#343a5a" stroke="#7fd7e8" stroke-width="2"/><text x="838.5" y="682.56" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">U</text><rect x="884.5" y="639" width="66" height="66" rx="14" fill="#343a5a" stroke="#7fd7e8" stroke-width="2"/><text x="917.5" y="682.56" fill="#f5ecfa" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">Y</text><text x="720" y="742" fill="#d7c2df" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="middle">Tap a vowel tile, or drag it into the gap.</text><rect x="600" y="754" width="240" height="56" rx="17" fill="#df3b99" stroke="none" stroke-width="1"/><text x="720.0" y="791" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Submit vowel</text></svg>