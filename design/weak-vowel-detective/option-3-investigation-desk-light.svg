<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f5effa" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1440" height="72" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="0" y1="72" x2="1440" y2="72" stroke="#e4bfe2" stroke-width="2" stroke-linecap="round"/><rect x="28" y="18" width="106" height="36" rx="18.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="81.0" y="41.1" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle">← Back</text><text x="161" y="43" fill="#a32773" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="start">Scarlett’s Spells</text><text x="1200" y="42" fill="#574a63" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.2">THE SECRET LIFE OF VOWELS</text><text x="60" y="111" fill="#a32773" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" text-anchor="start" letter-spacing="1.4">OPTION 3 · INVESTIGATION DESK</text><rect x="520" y="83" width="106" height="34" rx="17.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="573.0" y="104.42" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Learn</text><rect x="635" y="83" width="106" height="34" rx="17.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="688.0" y="104.42" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dinner</text><rect x="750" y="83" width="106" height="34" rx="17.0" fill="#c92286" stroke="#c92286" stroke-width="2"/><text x="803.0" y="104.42" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Detective</text><rect x="865" y="83" width="106" height="34" rx="17.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="918.0" y="104.42" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Memory</text><rect x="980" y="83" width="106" height="34" rx="17.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="1033.0" y="104.42" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dictation</text><rect x="1095" y="83" width="106" height="34" rx="17.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="1148.0" y="104.42" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Reflect</text><rect x="35" y="135" width="1370" height="738" rx="28" fill="#f1ecfb" stroke="#e4bfe2" stroke-width="1.5"/><text x="720" y="185" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" text-anchor="middle">Vowel Detective</text><rect x="70" y="207" width="1300" height="119" rx="22" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="95" y="237" fill="#a32773" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="start" letter-spacing="1.4">THE GAME</text><text x="95" y="272" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">A quiet vowel has gone missing. Listen and choose its spelling.</text><text x="95" y="301" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Then explore related words for a clue and try again from memory.</text><rect x="70" y="338" width="1300" height="114" rx="22" fill="#fff0bd" stroke="#e8b948" stroke-width="2"/><text x="95" y="368" fill="#a32773" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="start" letter-spacing="1.2">HOW TO DO THE TASK</text><text x="95" y="403" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">Hear the word  →  Choose A, E, I, O, U or Y  →  Submit</text><text x="95" y="434" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Explore its family if available, then try the vowel again without the tree.</text><rect x="70" y="466" width="840" height="369" rx="25" fill="#e8f9fc" stroke="#7fdce9" stroke-width="2"/><text x="98" y="497" fill="#574a63" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="start" letter-spacing="1.2">WORD 1 OF 5 · FIRST THOUGHT</text><text x="98" y="536" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="start">Which vowel belongs in the gap?</text><rect x="693" y="503" width="185" height="50" rx="25.0" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="785.5" y="533.78" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle">▶ Hear the word</text><text x="490" y="648" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="800" text-anchor="middle">hum_n</text><rect x="282.5" y="669" width="60" height="60" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="312.5" y="708.6" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">A</text><rect x="353.5" y="669" width="60" height="60" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="383.5" y="708.6" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">E</text><rect x="424.5" y="669" width="60" height="60" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="454.5" y="708.6" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">I</text><rect x="495.5" y="669" width="60" height="60" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="525.5" y="708.6" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">O</text><rect x="566.5" y="669" width="60" height="60" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="596.5" y="708.6" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">U</text><rect x="637.5" y="669" width="60" height="60" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="667.5" y="708.6" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">Y</text><rect x="370" y="760" width="240" height="56" rx="17" fill="#c92286" stroke="none" stroke-width="1"/><text x="490.0" y="797" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Submit vowel</text><rect x="927" y="466" width="443" height="369" rx="25" fill="#f8f0fb" stroke="#e4bfe2" stroke-width="2"/><text x="954" y="503" fill="#a32773" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="start" letter-spacing="1.1">NEXT: FAMILY INVESTIGATION</text><text x="954" y="551" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="start">Unlock after your first answer</text><text x="954" y="586" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Listen to related words and</text><text x="954" y="614" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">collect clues that help you</text><text x="954" y="642" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">remember the spelling.</text><line x1="954" y1="679" x2="1342" y2="679" stroke="#e4bfe2" stroke-width="2" stroke-linecap="round"/><text x="954" y="715" fill="#574a63" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Then close the tree and try</text><text x="954" y="743" fill="#574a63" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">the missing vowel again.</text></svg>