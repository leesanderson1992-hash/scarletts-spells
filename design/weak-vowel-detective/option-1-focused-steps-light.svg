<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f5effa" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1440" height="72" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="0" y1="72" x2="1440" y2="72" stroke="#e4bfe2" stroke-width="2" stroke-linecap="round"/><rect x="28" y="18" width="106" height="36" rx="18.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="81.0" y="41.1" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle">← Back</text><text x="161" y="43" fill="#a32773" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="start">Scarlett’s Spells</text><text x="1200" y="42" fill="#574a63" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.2">THE SECRET LIFE OF VOWELS</text><text x="60" y="111" fill="#a32773" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" text-anchor="start" letter-spacing="1.4">OPTION 1 · FOCUSED STEPS</text><rect x="520" y="83" width="106" height="34" rx="17.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="573.0" y="104.42" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Learn</text><rect x="635" y="83" width="106" height="34" rx="17.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="688.0" y="104.42" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dinner</text><rect x="750" y="83" width="106" height="34" rx="17.0" fill="#c92286" stroke="#c92286" stroke-width="2"/><text x="803.0" y="104.42" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Detective</text><rect x="865" y="83" width="106" height="34" rx="17.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="918.0" y="104.42" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Memory</text><rect x="980" y="83" width="106" height="34" rx="17.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="1033.0" y="104.42" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dictation</text><rect x="1095" y="83" width="106" height="34" rx="17.0" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="1148.0" y="104.42" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Reflect</text><rect x="35" y="135" width="1370" height="738" rx="28" fill="#f1ecfb" stroke="#e4bfe2" stroke-width="1.5"/><text x="720" y="185" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" text-anchor="middle">Vowel Detective</text><rect x="130" y="212" width="1180" height="155" rx="22" fill="#ffffff" stroke="#e4bfe2" stroke-width="2"/><text x="155" y="242" fill="#a32773" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="start" letter-spacing="1.4">THE GAME</text><text x="155" y="277" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">A quiet vowel has gone missing from the word.</text><text x="155" y="306" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Listen and choose its spelling. Then investigate related words</text><text x="155" y="335" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">for a clue before trying the vowel again from memory.</text><rect x="130" y="380" width="1180" height="126" rx="22" fill="#fff0bd" stroke="#e8b948" stroke-width="2"/><text x="155" y="410" fill="#a32773" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="start" letter-spacing="1.2">HOW TO DO THE TASK</text><text x="155" y="445" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">Hear the word  →  Choose A, E, I, O, U or Y  →  Submit</text><text x="155" y="476" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Explore its family if available, then try the vowel again without the tree.</text><rect x="130" y="520" width="1180" height="320" rx="25" fill="#e8f9fc" stroke="#7fdce9" stroke-width="2"/><text x="160" y="549" fill="#574a63" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="start" letter-spacing="1.2">WORD 1 OF 5 · FIRST THOUGHT</text><text x="160" y="590" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" text-anchor="start">Which vowel belongs in the gap?</text><rect x="1068" y="557" width="210" height="50" rx="25.0" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="1173.0" y="587.78" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="middle">▶ Hear the word</text><text x="720" y="674" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="800" text-anchor="middle">hum_n</text><rect x="521.0" y="696" width="58" height="58" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="550.0" y="734.28" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">A</text><rect x="589.0" y="696" width="58" height="58" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="618.0" y="734.28" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">E</text><rect x="657.0" y="696" width="58" height="58" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="686.0" y="734.28" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">I</text><rect x="725.0" y="696" width="58" height="58" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="754.0" y="734.28" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">O</text><rect x="793.0" y="696" width="58" height="58" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="822.0" y="734.28" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">U</text><rect x="861.0" y="696" width="58" height="58" rx="14" fill="#ffffff" stroke="#96dbe5" stroke-width="2"/><text x="890.0" y="734.28" fill="#211d38" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="middle">Y</text><rect x="600" y="771" width="240" height="56" rx="17" fill="#c92286" stroke="none" stroke-width="1"/><text x="720.0" y="808" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Submit vowel</text></svg>