<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f5effa" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1440" height="72" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="0" y1="72" x2="1440" y2="72" stroke="#e2cce8" stroke-width="2" stroke-linecap="round"/><rect x="28" y="18" width="106" height="36" rx="18.0" fill="#ffffff" stroke="#e5cceb" stroke-width="2"/><text x="81.0" y="41.1" fill="#18233c" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle">← Back</text><text x="161" y="43" fill="#952d70" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="start">Scarlett’s Spells</text><text x="1200" y="42" fill="#694b73" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.2">THE SECRET LIFE OF VOWELS</text><text x="60" y="111" fill="#8e4a83" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" text-anchor="start" letter-spacing="1.4">OPTION 3 · IMMERSIVE GAME BOARD</text><rect x="520" y="83" width="106" height="34" rx="17.0" fill="#fff" stroke="#e2cce8" stroke-width="2"/><text x="573.0" y="104.42" fill="#674c70" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Learn</text><rect x="635" y="83" width="106" height="34" rx="17.0" fill="#c12783" stroke="#c12783" stroke-width="2"/><text x="688.0" y="104.42" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dinner</text><rect x="750" y="83" width="106" height="34" rx="17.0" fill="#fff" stroke="#e2cce8" stroke-width="2"/><text x="803.0" y="104.42" fill="#674c70" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Detective</text><rect x="885" y="83" width="106" height="34" rx="17.0" fill="#fff" stroke="#e2cce8" stroke-width="2"/><text x="938.0" y="104.42" fill="#674c70" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Memory</text><rect x="1000" y="83" width="106" height="34" rx="17.0" fill="#fff" stroke="#e2cce8" stroke-width="2"/><text x="1053.0" y="104.42" fill="#674c70" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Dictation</text><rect x="1124" y="83" width="106" height="34" rx="17.0" fill="#fff" stroke="#e2cce8" stroke-width="2"/><text x="1177.0" y="104.42" fill="#674c70" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Reflect</text><text x="720" y="159" fill="#211b3a" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" text-anchor="middle">Call It To Dinner</text><rect x="147" y="184" width="1146" height="190" rx="23" fill="#ffffff" stroke="#e5c4e4" stroke-width="2"/><text x="174" y="210" fill="#9e2a76" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" text-anchor="start" letter-spacing="1.4">THE GAME</text><text x="174" y="236" fill="#2b2840" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">The goal of the game is to identify the stressed and unstressed syllables of the word.</text><text x="174" y="257" fill="#2b2840" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">It is a fun game called “Call It To Dinner”. Call each word as if you were shouting</text><text x="174" y="278" fill="#2b2840" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">its name to come downstairs for dinner. This shows which syllable we put the</text><text x="174" y="299" fill="#2b2840" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">largest amount of stress on. For example, SCAR-lett.</text><text x="174" y="320" fill="#2b2840" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">We cannot find unstressed vowels in a stressed syllable. Once we know the</text><text x="174" y="341" fill="#2b2840" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">unstressed syllables, we can identify the unstressed sound of “uh” or “ih”.</text><text x="174" y="362" fill="#2b2840" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">Remember: There can be more than 2 syllables in a word.</text><rect x="147" y="388" width="1146" height="111" rx="20" fill="#fff1bf" stroke="#e5b950" stroke-width="2"/><text x="174" y="414" fill="#72510c" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" text-anchor="start" letter-spacing="1.1">HOW TO DO THE TASK · CHANGES AFTER THE CUT</text><text x="174" y="440" fill="#3b2c14" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">BEFORE CUT · Look at the word below. First step: CALL IT TO DINNER! Chop it into syllables.</text><text x="174" y="463" fill="#3b2c14" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Listen button underneath.</text><text x="174" y="486" fill="#3b2c14" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">AFTER CUT · Great! Well done, now select the LAZY vowel sound.</text><rect x="147" y="510" width="1146" height="236" rx="28" fill="#242744" stroke="#60d7e7" stroke-width="2"/><text x="176" y="541" fill="#74dce6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" text-anchor="start" letter-spacing="1.4">WORD TILE · CHOP, THEN SELECT</text><text x="545.0" y="614" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="800" text-anchor="middle">c</text><text x="625.0" y="614" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="800" text-anchor="middle">o</text><text x="705.0" y="614" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="800" text-anchor="middle">m</text><text x="805.0" y="614" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="800" text-anchor="middle">m</text><rect x="862.0" y="567" width="46" height="62" rx="12" fill="#ffe29a" stroke="#edae40" stroke-width="2"/><text x="885.0" y="614" fill="#442a14" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="800" text-anchor="middle">a</text><line x1="585.0" y1="575" x2="585.0" y2="622" stroke="#37c8d9" stroke-width="4" stroke-linecap="round"/><line x1="665.0" y1="575" x2="665.0" y2="622" stroke="#37c8d9" stroke-width="4" stroke-linecap="round"/><line x1="755.0" y1="575" x2="755.0" y2="622" stroke="#e39421" stroke-width="6" stroke-linecap="round"/><line x1="845.0" y1="575" x2="845.0" y2="622" stroke="#37c8d9" stroke-width="4" stroke-linecap="round"/><g transform="translate(217,566) scale(0.66)"><path d="M0 0h48c8 0 14 6 14 14v28H6c-4 0-6-3-6-7z" fill="#bceff7" stroke="#219bb0" stroke-width="3"/><path d="M60 39l22 26" stroke="#a05719" stroke-width="9" stroke-linecap="round"/><path d="M60 39l22 26" stroke="#f6cf84" stroke-width="3" stroke-linecap="round"/><circle cx="15" cy="16" r="4" fill="#49b8c7"/></g><rect x="604.0" y="640" width="100" height="37" rx="18.5" fill="#343a5a" stroke="#60d7e7" stroke-width="2"/><text x="654.0" y="664.96" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle">com</text><rect x="737.0" y="640" width="100" height="37" rx="18.5" fill="#343a5a" stroke="#60d7e7" stroke-width="2"/><text x="787.0" y="664.96" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle">ma</text><rect x="610.0" y="696" width="220" height="38" rx="19.0" fill="#343a5a" stroke="#60d7e7" stroke-width="2"/><text x="720.0" y="720.1" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle">▶ Listen to comma</text><rect x="0" y="770" width="1440" height="130" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><line x1="0" y1="770" x2="1440" y2="770" stroke="#e5c4e4" stroke-width="2" stroke-linecap="round"/><rect x="147" y="791" width="132" height="47" rx="23.5" fill="#f7e6f1" stroke="#e5c4e4" stroke-width="2"/><text x="213.0" y="819.6" fill="#82366e" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Word 1 of 5</text><text x="309" y="821" fill="#2d7153" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">ON CORRECT ANSWER · Well done! You found the lazy sound.</text><rect x="1003" y="786" width="290" height="55" rx="18" fill="#ca2686" stroke="none" stroke-width="1"/><text x="1148.0" y="822" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" text-anchor="middle">Confirm answer</text></svg>