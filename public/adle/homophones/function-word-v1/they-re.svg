<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title"><title id="title">They are contracts to they're: the apostrophe replaces the a.</title><rect width="600" height="360" rx="32" fill="#fff2f8"/><text x="300" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="58" fill="#343044">THEY ARE</text><path d="M300 142v42m-14-14 14 14 14-14" fill="none" stroke="#d82983" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="78" fill="#b91c70">THEY'RE</text><text x="300" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#51485c">The apostrophe replaces A.</text></svg>
